name: Github Workflow Validator

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
    cancel-in-progress: true

on:
    pull_request:
        paths:
            - '.github/workflows/*'
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    validate:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: true
            - name: Install action-validator with asdf
              uses: asdf-vm/actions/install@v4.0.1
              with:
                  asdf_branch: v0.15.0
                  tool_versions: |
                      action-validator 0.6.0
            - name: Lint Actions
              continue-on-error: true
              id: validator
              run: |
                  ISSUES=$(cat << EOF
                  `action-validator .github/workflows/* 2>&1`
                  EOF
                  )
                  echo "ISSUES<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$ISSUES" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"
            - name: Comment workflow validator results
              uses: thollander/actions-comment-pull-request@v3.0.1
              if: ${{ (github.ref != 'refs/heads/main') && steps.validator.outputs.issues }}
              with:
                  message: |
                      Github Action Validator found these issues:
                      ```
                      ${{ steps.validator.outputs.issues }}
                      ```
                  comment-tag: validator
