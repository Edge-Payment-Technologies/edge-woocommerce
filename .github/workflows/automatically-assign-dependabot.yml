name: Auto-Assign Dependabot

on:
    pull_request:
        types: [opened]
    workflow_dispatch:

jobs:
    run:
        if: startsWith(github.head_ref, 'dependabot/')
        runs-on: ubuntu-24.04
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Auto-assign Issue
              uses: pozil/auto-assign-issue@v4.1.0
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: krainboltgreene,ziyan-junaideen
                  numOfAssignee: 1
