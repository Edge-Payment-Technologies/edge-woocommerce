name: Release

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v6.1.0
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-
            - name: Setup PHP
              uses: shivammathur/setup-php@2.37.2
              with:
                  php-version: '8.5.9'
                  tools: composer
            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: '26.1.0'
            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader
            - name: Install npm dependencies
              run: npm install
            - name: Build blocks and assets
              continue-on-error: true
              run: npm run build
            - name: Remove non-runtime vendor files
              run: |
                  find vendor -type d \( \
                    -name .github -o \
                    -name docs \
                  \) -prune -exec rm -rf -- {} +
                  find vendor -type f \( \
                    -name .yamllint -o \
                    -name 'CHANGELOG*' -o \
                    -name 'CONTRIBUTOR*' -o \
                    -name mise.toml -o \
                    -name 'README*' -o \
                    -name 'UPGRADING*' \
                  \) -delete
            - name: Build a plugin zip
              run: npm run plugin-zip
            - name: Verify the plugin zip
              run: |
                  unexpected_files="$(
                    unzip -Z1 edge-gateway-for-woocommerce.zip |
                      grep -E '/vendor/.*/(\.github|docs)(/|$)|/vendor/.*/(\.yamllint|CHANGELOG[^/]*|CONTRIBUTOR[^/]*|mise\.toml|README[^/]*|UPGRADING[^/]*)$' || true
                  )"

                  if [ -n "$unexpected_files" ]; then
                    echo "The plugin zip contains non-runtime vendor files:"
                    echo "$unexpected_files"
                    exit 1
                  fi
            - name: Upload release asset
              uses: softprops/action-gh-release@v3.0.3
              env:
                  # Note, this is an exception to action secrets: GH_TOKEN is always available and provides access to
                  # the current repository this action runs in.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  # Provide what the file should be named when attached to the release (plugin-name.zip)
                  files: ${{ github.workspace }}/edge-gateway-for-woocommerce.zip
            # - name: WordPress Plugin Deploy
            #   uses: 10up/action-wordpress-plugin-deploy@2.3.0
            #   env:
            #     SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
            #     SVN_USERNAME: ${{ secrets.WORDPRESS_SVN_USERNAME }}
            #     SLUG: edge-gateway-for-woocommerce # optional, remove if GitHub repo name matches SVN slug, including capitalization
